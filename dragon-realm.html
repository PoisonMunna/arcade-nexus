<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Realm</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@700;900&family=Uncial+Antiqua&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 30%, #1a0033 0%, #0d001a 60%, #000 100%);
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; font-family:'Cinzel',serif; overflow-x:hidden;
  }
  #gc { position:relative; margin:20px auto; border-radius:8px;
    box-shadow:0 0 60px rgba(255,100,0,0.4),0 0 120px rgba(200,0,255,0.2);
    border:2px solid rgba(255,120,0,0.4); }
  canvas { display:block; border-radius:8px; cursor:crosshair; }
  .hud { position:absolute;top:15px;left:15px;color:#ffaa00;font-size:13px;z-index:10;pointer-events:none; }
  .hud div { margin-bottom:6px;padding:6px 14px;background:rgba(0,0,0,0.8);border:1px solid rgba(255,150,0,0.3);border-radius:15px;text-shadow:0 0 8px #ff8800; }
  #ls {
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:linear-gradient(160deg,#0d0020 0%,#1a0033 40%,#0a0015 100%);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    z-index:100;border-radius:8px;
  }
  .gt { font-family:'Cinzel',serif;font-size:clamp(2.5rem,7vw,4.5rem);font-weight:900;
    color:#ff8800;text-shadow:0 0 30px #ff4400,0 0 60px #ff0000;
    margin-bottom:5px;letter-spacing:3px;text-align:center; }
  .gs { color:#cc44ff;font-size:1rem;margin-bottom:2rem;letter-spacing:2px; }
  .bw{width:min(300px,70%);height:8px;background:rgba(255,150,0,0.2);border-radius:4px;margin-bottom:1.5rem;overflow:hidden;}
  .bf{height:100%;background:linear-gradient(90deg,#ff8800,#ff4400);width:0%;transition:width 0.3s;box-shadow:0 0 10px #ff6600;}
  #lt{color:rgba(255,180,0,0.7);font-size:0.85rem;margin-bottom:2rem;}
  .btn{padding:14px 40px;border:none;border-radius:4px;font-family:'Cinzel',serif;font-size:1.1rem;
    cursor:pointer;transition:all 0.3s;opacity:0;transform:translateY(20px);
    background:linear-gradient(45deg,#ff6600,#ff2200);color:#fff;font-weight:700;
    letter-spacing:2px;box-shadow:0 0 20px rgba(255,100,0,0.5);clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);}
  .btn.show{opacity:1;transform:translateY(0);}
  .btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(255,100,0,0.8);}
  .ov{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.95);border:2px solid rgba(255,120,0,0.5);
    border-radius:8px;padding:35px;text-align:center;color:#ffaa00;
    display:none;z-index:20;width:min(420px,90%);backdrop-filter:blur(20px);}
  .ov h2{font-family:'Cinzel',serif;font-size:2.2rem;margin-bottom:15px;text-shadow:0 0 20px #ff6600;}
  .ov p{margin:8px 0;font-size:1rem;}
  .ov .hint{margin-top:20px;opacity:0.6;font-size:0.85rem;}
  .ci{position:absolute;bottom:15px;left:15px;color:rgba(255,170,0,0.6);font-size:11px;
    z-index:10;background:rgba(0,0,0,0.5);padding:6px 10px;border-radius:8px;pointer-events:none;}
</style>
</head>
<body>
<div id="gc">
  <div id="ls">
    <div class="gt">🐉 DRAGON<br>REALM</div>
    <div class="gs">UNLEASH ANCIENT FURY</div>
    <div class="bw"><div class="bf" id="lb"></div></div>
    <div id="lt">Summoning ancient power...</div>
    <button class="btn" id="sb">TAKE FLIGHT</button>
  </div>
  <canvas id="c"></canvas>
  <div class="hud" id="hud" style="display:none">
    <div>🔥 FIRE: <span id="fire">100</span>%</div>
    <div>❤ VITALITY: <span id="hp">100</span>%</div>
    <div>⚔ WAVE: <span id="wn">1</span></div>
    <div>💰 GOLD: <span id="sc">0</span></div>
  </div>
  <div class="ci">WASD: Fly | Mouse: Aim | Click: Breathe Fire</div>
  <div class="ov" id="ov">
    <h2 id="ot">DRAGON SLAIN</h2>
    <p id="o1"></p><p id="o2"></p><p id="o3"></p><p id="o4"></p>
    <div class="hint">Click to rise again</div>
  </div>
</div>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const W=900,H=620; canvas.width=W; canvas.height=H;
document.getElementById('gc').style.width=W+'px';

let gs='loading',score=0,wave=1,kills=0,combo=0,maxCombo=0;
let fireEnergy=100;
let player,flames=[],enemies=[],particles=[],powerUps=[];
const keys={},mouse={x:W/2,y:H/2,pressed:false};

// Scrolling parallax sky
let skyOffset=0;
function drawSky(){
  // Night sky gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050010'); g.addColorStop(0.6,'#150030'); g.addColorStop(1,'#2a0050');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Stars
  ctx.fillStyle='#ffffff';
  for(let i=0;i<80;i++){
    const sx=((i*137+skyOffset*0.1)%W), sy=((i*97)%H*0.7);
    const a=0.3+Math.sin(Date.now()*0.001+i)*0.3;
    ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(sx,sy,i%3===0?1.5:0.8,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // Moon
  const mg=ctx.createRadialGradient(W-100,80,0,W-100,80,50);
  mg.addColorStop(0,'#ffffee'); mg.addColorStop(0.7,'#ddddaa'); mg.addColorStop(1,'transparent');
  ctx.fillStyle=mg; ctx.beginPath(); ctx.arc(W-100,80,50,0,Math.PI*2); ctx.fill();
  // Castle silhouette
  ctx.fillStyle='#0a0015';
  ctx.fillRect(50,H-120,80,120); ctx.fillRect(100,H-160,30,50); ctx.fillRect(60,H-155,25,45);
  for(let tx=50;tx<=130;tx+=15){ ctx.fillRect(tx,H-165,10,15); }
  ctx.fillRect(130,H-130,120,130); ctx.fillRect(200,H-170,35,55);
  ctx.fillRect(160,H-160,30,45); for(let tx=130;tx<=250;tx+=15){ ctx.fillRect(tx,H-175,10,15);}
}

class Particle{
  constructor(x,y,col,type){
    this.x=x;this.y=y;this.color=col;
    this.vx=(Math.random()-0.5)*(type==='fire'?10:6);
    this.vy=(Math.random()-0.5)*(type==='fire'?10:6)-(type==='fire'?2:0);
    this.life=type==='fire'?30:20; this.maxLife=this.life;
    this.size=type==='fire'?Math.random()*8+3:Math.random()*4+1;
    this.type=type;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.1;this.vx*=0.95;this.life--;}
  draw(){
    ctx.save();ctx.globalAlpha=this.life/this.maxLife;
    if(this.type==='fire'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size);
      g.addColorStop(0,'#ffffff');g.addColorStop(0.3,'#ffcc00');g.addColorStop(0.7,this.color);g.addColorStop(1,'transparent');
      ctx.fillStyle=g;
    }else ctx.fillStyle=this.color;
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

class Dragon{
  constructor(){this.x=W*0.2;this.y=H*0.5;this.r=24;this.speed=240;this.hp=100;this.maxHp=100;this.angle=0;this.wingT=0;this.invT=0;}
  update(dt){
    let dx=0,dy=0;
    if(keys['KeyW']||keys['ArrowUp'])dy-=1;
    if(keys['KeyS']||keys['ArrowDown'])dy+=1;
    if(keys['KeyA']||keys['ArrowLeft'])dx-=1;
    if(keys['KeyD']||keys['ArrowRight'])dx+=1;
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    this.x=Math.max(this.r,Math.min(W-this.r,this.x+dx*this.speed*(dt/1000)));
    this.y=Math.max(this.r,Math.min(H-this.r,this.y+dy*this.speed*(dt/1000)));
    this.angle=Math.atan2(mouse.y-this.y,mouse.x-this.x);
    this.wingT+=dt*0.006;
    if(this.invT>0)this.invT-=dt;
    if(fireEnergy<100) fireEnergy+=8*(dt/1000);
    fireEnergy=Math.min(100,fireEnergy);
  }
  shoot(dt){
    if(this._ls===undefined)this._ls=0;
    const now=Date.now(); if(now-this._ls<80)return;
    if(fireEnergy<3)return; this._ls=now;
    const spread=(Math.random()-0.5)*0.1;
    const a=this.angle+spread;
    flames.push({x:this.x+Math.cos(this.angle)*28,y:this.y+Math.sin(this.angle)*28,
      vx:Math.cos(a)*500,vy:Math.sin(a)*500,r:8,dmg:20,born:Date.now()});
    fireEnergy-=2;
    for(let i=0;i<5;i++) particles.push(new Particle(this.x+Math.cos(this.angle)*22,this.y+Math.sin(this.angle)*22,'#ff4400','fire'));
  }
  takeDmg(d){
    if(this.invT>0)return; this.hp-=d; this.invT=800; combo=0;
    for(let i=0;i<8;i++) particles.push(new Particle(this.x,this.y,'#cc0000','fire'));
    if(this.hp<=0){this.hp=0;endGame();}
    canvas.style.filter='brightness(2.5)'; setTimeout(()=>canvas.style.filter='',120);
  }
  draw(){
    if(this.invT>0&&Math.floor(this.invT/100)%2===0)return;
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
    const ws=Math.sin(this.wingT)*12;
    // Wings
    ctx.fillStyle='rgba(100,0,200,0.8)';
    ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(-30,-20-ws); ctx.lineTo(-15,5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(-30,20+ws); ctx.lineTo(-15,-5); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(150,0,255,0.5)';
    ctx.beginPath(); ctx.moveTo(-10,-6); ctx.lineTo(-40,-15-ws*1.5); ctx.lineTo(-25,3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-10,6); ctx.lineTo(-40,15+ws*1.5); ctx.lineTo(-25,-3); ctx.closePath(); ctx.fill();
    // Body
    const bg=ctx.createLinearGradient(-20,0,20,0);
    bg.addColorStop(0,'#550000'); bg.addColorStop(0.5,'#880000'); bg.addColorStop(1,'#550000');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.moveTo(22,0); ctx.lineTo(-10,-12); ctx.lineTo(-20,-6); ctx.lineTo(-20,6); ctx.lineTo(-10,12); ctx.closePath(); ctx.fill();
    // Scales
    ctx.strokeStyle='#aa2200'; ctx.lineWidth=1;
    for(let i=-15;i<=15;i+=7){ ctx.beginPath(); ctx.arc(i,0,4,Math.PI,0); ctx.stroke(); }
    // Head
    ctx.fillStyle='#aa0000'; ctx.beginPath(); ctx.arc(15,0,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff6600'; ctx.beginPath(); ctx.arc(22,0,6,0,Math.PI*2); ctx.fill();
    // Eye
    ctx.fillStyle='#ffff00'; ctx.beginPath(); ctx.arc(18,-3,3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(19,-3,1.5,0,Math.PI*2); ctx.fill();
    // Fire breath when shooting
    if(mouse.pressed&&fireEnergy>0){
      ctx.save(); ctx.globalAlpha=0.7;
      const fg=ctx.createLinearGradient(22,0,50,0);
      fg.addColorStop(0,'#ffffff'); fg.addColorStop(0.3,'#ffcc00'); fg.addColorStop(1,'transparent');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.moveTo(22,-3); ctx.lineTo(55,-8); ctx.lineTo(55,8); ctx.lineTo(22,3); ctx.closePath(); ctx.fill(); ctx.restore();
    }
    // Tail
    ctx.strokeStyle='#770000'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(-18,0); ctx.quadraticCurveTo(-35,20,-50,10); ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-35,15); ctx.lineTo(-55,25); ctx.stroke();
    ctx.restore();
  }
}

class Enemy{
  constructor(x,y,type='knight'){
    this.x=x;this.y=y;this.type=type;this.r=type==='wizard'?16:type==='ballista'?22:18;
    this.speed=type==='wizard'?80:type==='ballista'?0:95+wave*4;
    this.hp=type==='wizard'?80+wave*12:type==='ballista'?150+wave*20:60+wave*8;
    this.maxHp=this.hp;this.angle=0;this.sTimer=0;
    this.sInt=type==='ballista'?1200:type==='wizard'?900:2000;
    this.lastAtk=0; this.floatT=Math.random()*Math.PI*2;
  }
  update(dt){
    const dx=player.x-this.x,dy=player.y-this.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    this.angle=Math.atan2(dy,dx); this.floatT+=dt*0.003;
    if(this.type!=='ballista'){
      const keepDist=this.type==='wizard'?180:80;
      if(dist>keepDist){this.x+=dx/dist*this.speed*(dt/1000);this.y+=dy/dist*this.speed*(dt/1000);}
      if(this.type==='wizard'){this.y+=Math.sin(this.floatT)*0.5;}
    }
    this.x=Math.max(this.r,Math.min(W-this.r,this.x));
    this.y=Math.max(this.r,Math.min(H-this.r,this.y));
    this.sTimer+=dt;
    if(this.sTimer>this.sInt&&dist<500){this.shoot();this.sTimer=0;}
    if(dist<this.r+player.r){
      const now=Date.now(); if(now-this.lastAtk>1000){player.takeDmg(this.type==='knight'?15:10);this.lastAtk=now;}
    }
  }
  shoot(){
    const a=this.angle+(Math.random()-0.5)*0.15;
    if(this.type==='ballista'){
      // Fires 3 bolts
      [-0.15,0,0.15].forEach(off=>{
        flames.push({x:this.x,y:this.y,vx:Math.cos(this.angle+off)*380,vy:Math.sin(this.angle+off)*380,r:6,dmg:18,born:Date.now(),enemy:true,color:'#8888ff'});
      });
    }else{
      flames.push({x:this.x,y:this.y,vx:Math.cos(a)*320,vy:Math.sin(a)*320,r:5,dmg:this.type==='wizard'?14:10,born:Date.now(),enemy:true,color:this.type==='wizard'?'#cc44ff':'#aaaaff'});
    }
    for(let i=0;i<4;i++) particles.push(new Particle(this.x,this.y,this.type==='wizard'?'#aa00ff':'#6688ff','fire'));
  }
  takeDmg(d){
    this.hp-=d;
    for(let i=0;i<5;i++) particles.push(new Particle(this.x,this.y,this.type==='wizard'?'#aa00ff':'#ff8800','fire'));
    if(this.hp<=0)this.die();
  }
  die(){
    const pts=this.type==='ballista'?400:this.type==='wizard'?250:100;
    score+=Math.floor(pts*wave*(1+combo*0.05)); kills++; combo++; maxCombo=Math.max(maxCombo,combo);
    if(Math.random()<(this.type==='ballista'?0.8:0.25)) powerUps.push(new PowerUp(this.x,this.y));
    for(let i=0;i<(this.type==='ballista'?20:12);i++) particles.push(new Particle(this.x,this.y,this.type==='wizard'?'#cc44ff':'#ff8800','fire'));
    enemies.splice(enemies.indexOf(this),1);
    if(enemies.length===0)setTimeout(nextWave,2500);
  }
  draw(){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle+Math.PI);
    if(this.type==='knight'){
      // Armored knight
      ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#aaa'; ctx.fillRect(-8,-4,16,8);
      ctx.fillStyle='#666'; ctx.beginPath(); ctx.arc(-3,0,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#cc0000'; ctx.fillRect(5,-2,12,4); // Sword
      ctx.strokeStyle='#ffcc00'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.stroke();
    }else if(this.type==='wizard'){
      // Floating wizard
      ctx.fillStyle='#220044'; ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#8800cc'; ctx.beginPath(); ctx.arc(-2,0,10,0,Math.PI*2); ctx.fill();
      // Robe
      ctx.fillStyle='#440088'; ctx.fillRect(-8,5,16,12);
      // Staff
      ctx.strokeStyle='#aa88ff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(22,0); ctx.stroke();
      ctx.fillStyle='#ffaaff'; ctx.beginPath(); ctx.arc(24,0,5,0,Math.PI*2); ctx.fill();
      // Stars around wizard
      ctx.save(); ctx.globalAlpha=0.5+Math.sin(this.floatT)*0.3;
      ctx.fillStyle='#ffaaff'; ['#aa44ff','#ff88ff','#88aaff'].forEach((c,i)=>{
        const a=this.floatT+i*(Math.PI*2/3); ctx.fillStyle=c;
        ctx.beginPath(); ctx.arc(Math.cos(a)*22,Math.sin(a)*22,3,0,Math.PI*2); ctx.fill();
      }); ctx.restore();
    }else{
      // Ballista (siege weapon)
      ctx.fillStyle='#5a3a10'; ctx.fillRect(-18,-10,36,20);
      ctx.fillStyle='#8a5a20'; ctx.fillRect(-15,-7,30,14);
      ctx.fillStyle='#333'; ctx.fillRect(12,-4,20,8);
      ctx.strokeStyle='#aaa'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(22,0); ctx.lineTo(0,14); ctx.stroke();
      ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    // HP bar
    const bw=this.r*2.5; ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(this.x-bw/2,this.y-this.r-10,bw,4);
    ctx.fillStyle=this.hp/this.maxHp>0.5?'#44ff88':'#ff4400'; ctx.fillRect(this.x-bw/2,this.y-this.r-10,bw*(this.hp/this.maxHp),4);
    if(this.type==='ballista'){ ctx.fillStyle='#ffcc00'; ctx.font='bold 10px Cinzel'; ctx.textAlign='center'; ctx.fillText('BALLISTA',this.x,this.y-this.r-15); }
  }
}

class PowerUp{
  constructor(x,y){this.x=x;this.y=y;this.r=14;this.t=0;
    this.type=Math.random()<0.5?'fire':'health'; this.color=this.type==='fire'?'#ff8800':'#ff4455';}
  update(dt){this.t+=dt; if(this.t>8000)powerUps.splice(powerUps.indexOf(this),1);}
  draw(){
    const p=1+Math.sin(this.t/200)*0.2;
    ctx.save(); ctx.shadowBlur=15; ctx.shadowColor=this.color;
    ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,this.r*p,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.type==='fire'?'🔥':'♥',this.x,this.y); ctx.restore();
  }
}

function spawnWave(){
  const count=4+Math.floor(wave*1.3);
  for(let i=0;i<count;i++){
    const side=Math.floor(Math.random()*4); let x,y;
    if(side===0){x=Math.random()*W;y=-30;} else if(side===1){x=W+30;y=Math.random()*H;}
    else if(side===2){x=Math.random()*W;y=H+30;} else{x=-30;y=Math.random()*H;}
    const r=Math.random();
    const type=wave>=4&&r<0.2?'ballista':wave>=2&&r<0.35?'wizard':'knight';
    enemies.push(new Enemy(x,y,type));
  }
}
function nextWave(){wave++;setTimeout(spawnWave,500);}
function endGame(){
  gs='gameOver'; document.getElementById('ov').style.display='block';
  document.getElementById('ot').textContent='⚔ DRAGON SLAIN';
  document.getElementById('o1').textContent='Gold Earned: '+Math.floor(score);
  document.getElementById('o2').textContent='Enemies Vanquished: '+kills;
  document.getElementById('o3').textContent='Waves Conquered: '+wave;
  document.getElementById('o4').textContent='Longest Combo: '+maxCombo+'x';
}

function updateHUD(){
  document.getElementById('fire').textContent=Math.floor(fireEnergy);
  document.getElementById('hp').textContent=Math.floor(player.hp);
  document.getElementById('wn').textContent=wave;
  document.getElementById('sc').textContent=Math.floor(score);
}

function checkCollisions(){
  for(let i=flames.length-1;i>=0;i--){
    const f=flames[i];
    if(!f.enemy){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j]; const dx=f.x-e.x,dy=f.y-e.y;
        if(Math.sqrt(dx*dx+dy*dy)<f.r+e.r){e.takeDmg(f.dmg);flames.splice(i,1);break;}
      }
    }else{
      const dx=f.x-player.x,dy=f.y-player.y;
      if(Math.sqrt(dx*dx+dy*dy)<f.r+player.r){player.takeDmg(f.dmg);flames.splice(i,1);}
    }
  }
  for(let i=powerUps.length-1;i>=0;i--){
    const p=powerUps[i]; const dx=player.x-p.x,dy=player.y-p.y;
    if(Math.sqrt(dx*dx+dy*dy)<player.r+p.r){
      if(p.type==='fire')fireEnergy=Math.min(100,fireEnergy+50); else player.hp=Math.min(player.maxHp,player.hp+40);
      for(let j=0;j<15;j++) particles.push(new Particle(p.x,p.y,p.color,'fire'));
      powerUps.splice(i,1);
    }
  }
}

let lastTime=0;
function loop(now){
  const dt=Math.min(now-lastTime,50); lastTime=now; skyOffset+=dt*0.05;
  if(gs==='playing'){
    player.update(dt);
    if(mouse.pressed) player.shoot(dt);
    flames.forEach((f,i)=>{
      f.x+=f.vx*(dt/1000); f.y+=f.vy*(dt/1000);
      for(let j=0;j<2;j++) particles.push(new Particle(f.x,f.y,f.color||'#ff6600','fire'));
      if(f.x<-20||f.x>W+20||f.y<-20||f.y>H+20||Date.now()-f.born>2000) flames.splice(i,1);
    });
    enemies.forEach(e=>e.update(dt));
    particles.forEach((p,i)=>{p.update();if(p.life<=0)particles.splice(i,1);});
    powerUps.forEach(p=>p.update(dt));
    checkCollisions(); updateHUD();
  }
  drawSky();
  if(gs==='playing'||gs==='paused'){
    powerUps.forEach(p=>p.draw());
    particles.forEach(p=>p.draw());
    flames.forEach(f=>{
      ctx.save(); ctx.shadowBlur=12; ctx.shadowColor=f.color||'#ff6600';
      const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r*1.5);
      fg.addColorStop(0,'#fff'); fg.addColorStop(0.5,f.color||'#ff6600'); fg.addColorStop(1,'transparent');
      ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); ctx.restore();
    });
    enemies.forEach(e=>e.draw());
    player.draw();
    // Fire bar
    const fbx=W/2-100,fby=H-20;
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(fbx,fby,200,12);
    const fg2=ctx.createLinearGradient(fbx,0,fbx+200,0);
    fg2.addColorStop(0,'#ff2200'); fg2.addColorStop(0.5,'#ff8800'); fg2.addColorStop(1,'#ffff00');
    ctx.fillStyle=fg2; ctx.fillRect(fbx,fby,200*(fireEnergy/100),12);
    ctx.strokeStyle='rgba(255,150,0,0.5)'; ctx.lineWidth=1; ctx.strokeRect(fbx,fby,200,12);
    ctx.fillStyle='#ffcc00'; ctx.font='10px Cinzel'; ctx.textAlign='center'; ctx.fillText('🔥 FIRE BREATH',W/2,fby-3); ctx.textAlign='left';
    if(enemies.length===0&&gs==='playing'){
      ctx.fillStyle='rgba(255,180,0,0.9)'; ctx.font='bold 28px Cinzel'; ctx.textAlign='center';
      ctx.fillText('WAVE '+wave+' VANQUISHED!',W/2,H/2-20); ctx.font='18px Cinzel';
      ctx.fillText('Next wave approaches...',W/2,H/2+15); ctx.textAlign='left';
    }
    if(combo>=3){ ctx.fillStyle='#ff8800'; ctx.font='bold 18px Cinzel'; ctx.textAlign='right'; ctx.fillText('🔥 COMBO x'+combo,W-15,35); ctx.textAlign='left'; }
    if(gs==='paused'){
      ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ffaa00'; ctx.font='bold 40px Cinzel'; ctx.textAlign='center';
      ctx.fillText('PAUSED',W/2,H/2); ctx.font='18px Cinzel'; ctx.fillText('Press P to continue',W/2,H/2+40); ctx.textAlign='left';
    }
  }
  requestAnimationFrame(loop);
}

function startGame(){
  gs='playing'; document.getElementById('ls').style.display='none'; document.getElementById('hud').style.display='block';
  player=new Dragon(); spawnWave(); requestAnimationFrame(loop);
}
function restartGame(){
  score=0;wave=1;kills=0;combo=0;maxCombo=0;fireEnergy=100;
  flames=[];enemies=[];particles=[];powerUps=[]; player=new Dragon();
  document.getElementById('ov').style.display='none'; gs='playing'; spawnWave();
}

// Load bar
(function(){
  const msgs=['Summoning ancient power...','Forging dragon scales...','Raising enemy army...','Enchanting weapons...','The realm awakens'];
  let prog=0,mi=0;
  const iv=setInterval(()=>{
    prog+=Math.random()*15+5; if(prog>100)prog=100;
    document.getElementById('lb').style.width=prog+'%';
    if(mi<msgs.length-1&&prog>(mi+1)*20){mi++;document.getElementById('lt').textContent=msgs[mi];}
    if(prog>=100){clearInterval(iv);document.getElementById('sb').classList.add('show');}
  },200);
})();

document.addEventListener('keydown',e=>{
  ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)&&e.preventDefault();
  keys[e.code]=true;
  if(e.code==='KeyP'&&gs==='playing')gs='paused';
  else if(e.code==='KeyP'&&gs==='paused')gs='playing';
  if(e.code==='KeyR'&&gs==='gameOver')restartGame();
});
document.addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;});
canvas.addEventListener('mousedown',()=>mouse.pressed=gs==='playing');
canvas.addEventListener('mouseup',()=>mouse.pressed=false);
document.getElementById('sb').addEventListener('click',startGame);
document.getElementById('ov').addEventListener('click',()=>gs==='gameOver'&&restartGame());
</script>
</body>
